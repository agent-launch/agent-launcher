name: Feature Request / 功能建议
description: Suggest a focused improvement / 建议一项聚焦的改进
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What workflow is difficult today, and for whom? / 当前哪个工作流程对哪些用户造成了困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
      description: Describe the smallest useful outcome. / 请描述最小但有用的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 替代方案
      description: Which workarounds or alternatives have you considered? / 你考虑过哪些替代方案或临时做法？
  - type: dropdown
    id: area
    attributes:
      label: Area / 范围
      options:
        - Onboarding and CLI linking / 引导和 CLI 关联
        - Provider configuration / 服务商配置
        - Terminal or chat / 终端或聊天
        - Sessions and usage / 会话和用量
        - MCP or Skills
        - Packaging or updates / 打包或更新
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation / 确认
      options:
        - label: I searched existing issues and discussions for similar requests. / 我已搜索现有 Issue 和讨论中的类似建议。
          required: true
