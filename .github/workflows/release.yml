name: release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release when the ref is a semver tag
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  STRICT_VERSION_REF_RE: '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[A-Za-z][0-9A-Za-z-]*|[0-9A-Za-z][0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[A-Za-z][0-9A-Za-z-]*|[0-9A-Za-z][0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            package_script: package:mac
          - name: windows
            os: windows-latest
            package_script: package:win
          - name: linux
            os: ubuntu-22.04
            package_script: package:linux
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging deps
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm verify

      - name: Set package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-sha-${GITHUB_SHA:0:7}"
          fi
          echo "Using version ${VERSION}"
          pnpm pkg set version="${VERSION}"

      # `mac.forceCodeSigning: true` makes an unsigned macOS build a hard
      # failure, and `release` needs every build job, so a missing certificate
      # would block the Windows and Linux releases too. Say so up front instead
      # of failing deep inside electron-builder. Pull-request builds are exempt:
      # electron-builder skips signing on them before the flag is consulted.
      - name: Require macOS signing credentials
        if: matrix.name == 'macos' && github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          if [[ "$SIGNING_CONFIGURED" != "true" ]]; then
            echo "::error::MAC_CSC_LINK is not configured. A macOS build without a Developer ID certificate fails by design, and that also blocks the Windows and Linux releases for this ref. Configure MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID before tagging or dispatching this workflow."
            exit 1
          fi

      # electron-builder's own createKeychain is broken for this case: it creates
      # the temporary keychain with a random password but then calls
      # `security set-key-partition-list -k <CSC_KEY_PASSWORD>` — the .p12 export
      # password, not the keychain password (app-builder-lib 26.15.3,
      # out/codeSign/macCodeSign.js, createKeychain vs importCerts). That is a
      # no-op while the keychain happens to be unlocked and fails with
      # "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct" when it is not, which is what runners hit. Manage the keychain
      # here instead and hand electron-builder the finished article via
      # CSC_KEYCHAIN, which it honours only when CSC_LINK is absent
      # (out/macPackager.js).
      - name: Import macOS signing certificate
        if: matrix.name == 'macos' && github.event_name != 'pull_request'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/agent-launcher-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/mac-signing-cert.p12"

          printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          # The keychain password, which is what -k actually wants.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign only searches keychains on the user search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::No \"Developer ID Application\" identity in the imported keychain. Check that MAC_CSC_LINK is a base64 .p12 holding a Developer ID Application certificate and its private key, and that MAC_CSC_KEY_PASSWORD is its export password."
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
          # macOS deliberately omitted: CSC_KEYCHAIN (set by the step above) is
          # only honoured when CSC_LINK is unset.
          CSC_LINK: ${{ matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.name == 'macos' && secrets.MAC_CSC_LINK != '') || (matrix.name == 'windows' && secrets.WIN_CSC_LINK != '') }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          # An empty CSC_LINK is not the same as an unset one: chooseNotNull only
          # skips null, so electron-builder would treat "" as a real path and
          # fail resolving it. GitHub always materialises env keys, so drop them.
          if [[ -z "${CSC_LINK:-}" ]]; then unset CSC_LINK; fi
          if [[ -z "${CSC_KEY_PASSWORD:-}" ]]; then unset CSC_KEY_PASSWORD; fi
          pnpm ${{ matrix.package_script }}

      # Excluded on pull requests because electron-builder skips macOS signing
      # there outright (isSignAllowed -> isPullRequest, out/codeSign/macCodeSign.js),
      # so the artifact is deliberately unsigned and verifying it would always
      # fail. Gating on whether the *secrets* exist is not the same question and
      # was wrong once they were configured. Windows needs no such exclusion:
      # winPackager has no pull-request branch, so it signs on PRs too.
      - name: Verify macOS signing and notarization
        if: matrix.name == 'macos' && github.event_name != 'pull_request'
        shell: bash
        env:
          NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID != '' }}
        run: |
          # Secrets are guaranteed here by "Require macOS signing credentials".
          verified=0
          while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            if [[ "$NOTARIZATION_CONFIGURED" == "true" ]]; then
              # electron-builder staples the notarization ticket to the .app, not the DMG.
              xcrun stapler validate "$bundle"
            fi
            verified=$((verified + 1))
          # Electron nests helper .app bundles under Contents/Frameworks. They are
          # covered by the top-level bundle's deep signature, but a notarization
          # ticket is only ever stapled to the outer bundle, so validating them
          # individually always fails.
          done < <(find release -type d -name '*.app' -not -path '*/Contents/*' -print0)
          if [[ "$verified" -eq 0 ]]; then
            echo "::error::No .app bundle found under release/; the signing check verified nothing."
            exit 1
          fi
          echo "Verified ${verified} signed bundle(s)."

      - name: Verify Windows signature
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          if ($env:SIGNING_CONFIGURED -ne 'true') {
            Write-Host 'Windows signing secrets are not configured; artifacts are explicitly unsigned.'
            exit 0
          }
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($_.Name): $($signature.Status)"
            }
          }

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-launcher-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 3 }}

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.inputs.publish_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            echo "::error::Release tags must be v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-<prerelease>."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify update metadata
        shell: bash
        run: |
          fail=0
          for file in latest-mac.yml latest.yml latest-linux.yml; do
            if [[ ! -f "artifacts/${file}" ]]; then
              echo "::error::Missing ${file}; electron-updater clients need it."
              fail=1
              continue
            fi
            # electron-updater downloads by the exact file name written into the
            # yml, so every referenced name must exist in the upload set — a
            # mismatch 404s the auto-update (this shipped broken in v0.1.0 and
            # v0.2.0-rc.1 via `${productName}`'s space).
            while IFS= read -r name; do
              if [[ ! -f "artifacts/${name}" ]]; then
                echo "::error::${file} references '${name}', which is not among the uploaded artifacts; updater downloads would 404."
                fail=1
              fi
            done < <(sed -n -E 's/^[[:space:]]*(- )?(url|path):[[:space:]]*(.+)$/\3/p' "artifacts/${file}" | sort -u)
          done
          # GitHub rewrites characters it disallows in release asset names
          # (a space becomes a dot), which silently breaks the yml ↔ asset
          # correspondence even when the check above passes against local files.
          while IFS= read -r artifact; do
            base="$(basename "$artifact")"
            if [[ ! "$base" =~ ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$ ]]; then
              echo "::error::Artifact name '${base}' contains characters GitHub rewrites on upload; the published asset would no longer match the update metadata."
              fail=1
            fi
          done < <(find artifacts -type f)
          exit "$fail"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          # Always publish as a prerelease: promotion to a full release is a
          # manual step. `releases/latest` skips prereleases, so no updater
          # client sees the build until a human promotes it.
          prerelease: true
