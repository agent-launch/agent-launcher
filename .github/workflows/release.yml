name: release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub Release when the ref is a semver tag
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  STRICT_VERSION_REF_RE: '^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[A-Za-z][0-9A-Za-z-]*|[0-9A-Za-z][0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[A-Za-z][0-9A-Za-z-]*|[0-9A-Za-z][0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            package_script: package:mac
          - name: windows
            os: windows-latest
            package_script: package:win
          - name: linux
            os: ubuntu-22.04
            package_script: package:linux
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging deps
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm verify

      - name: Set package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-sha-${GITHUB_SHA:0:7}"
          fi
          echo "Using version ${VERSION}"
          pnpm pkg set version="${VERSION}"

      - name: Build package
        env:
          ELECTRON_BUILDER_PUBLISH: never
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ matrix.name == 'macos' && secrets.MAC_CSC_LINK || matrix.name == 'windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'macos' && secrets.MAC_CSC_KEY_PASSWORD || matrix.name == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.name == 'macos' && secrets.MAC_CSC_LINK != '') || (matrix.name == 'windows' && secrets.WIN_CSC_LINK != '') }}
          APPLE_ID: ${{ matrix.name == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.name == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm ${{ matrix.package_script }}

      - name: Verify macOS signing and notarization
        if: matrix.name == 'macos'
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ secrets.MAC_CSC_LINK != '' }}
          NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID != '' }}
        run: |
          if [[ "$SIGNING_CONFIGURED" != "true" ]]; then
            echo "macOS signing secrets are not configured; artifacts are explicitly unsigned."
            exit 0
          fi
          while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            if [[ "$NOTARIZATION_CONFIGURED" == "true" ]]; then
              # electron-builder staples the notarization ticket to the .app, not the DMG.
              xcrun stapler validate "$bundle"
            fi
          done < <(find release -type d -name '*.app' -print0)

      - name: Verify Windows signature
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          if ($env:SIGNING_CONFIGURED -ne 'true') {
            Write-Host 'Windows signing secrets are not configured; artifacts are explicitly unsigned.'
            exit 0
          }
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($_.Name): $($signature.Status)"
            }
          }

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-launcher-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 3 }}

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event.inputs.publish_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ $STRICT_VERSION_REF_RE ]]; then
            echo "::error::Release tags must be v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-<prerelease>."
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify update metadata
        shell: bash
        run: |
          missing=0
          for file in latest-mac.yml latest.yml latest-linux.yml; do
            if [[ ! -f "artifacts/${file}" ]]; then
              echo "::error::Missing ${file}; electron-updater clients need it."
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
